    <text x="49" y="152" font-size="53" font-weight="700" letter-spacing="-1.5" fill="#F4F8FC">Jensen (Liuyu) Xiong</text>
    <text x="52" y="190" font-size="21" fill="#B8CBDC">Thoughtful analysis. Transparent evidence.</text>
