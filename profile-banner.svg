<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Jensen (Liuyu) Xiong</title>
  <desc id="desc">Financial data, quantitative research, thoughtful implementation. Decorative geometric data motif; not a performance chart.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B182B"/>
      <stop offset="1" stop-color="#172F46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5FE1CF"/>
      <stop offset="1" stop-color="#75B9F5"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#80A7BF" opacity="0.17"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#background)"/>
  <rect x="812" y="25" width="358" height="250" fill="url(#grid)"/>
  <rect x="52" y="49" width="42" height="4" rx="2" fill="url(#accent)"/>
